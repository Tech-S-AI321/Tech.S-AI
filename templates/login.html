<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#317EFB">
    <title>Login | Tech.S AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="manifest" href="/manifest.json">
</head>
<body>
    <nav>
        <div class="logo">
            <img src="{{ url_for('static', filename='logo.jpeg') }}" alt="TECH S Logo" width="40">
            Tech.S AI
        </div>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/signup/">Sign Up</a></li>
        </ul>
        <button class="hamburger" id="hamburger">
            <i class="fas fa-bars"></i>
        </button>
        <button class="theme-toggle" id="theme-toggle" title="Toggle Dark/Light Mode">
            <i class="fas fa-moon"></i>
        </button>
    </nav>

    <section class="auth-page">
        <div class="auth-card">
            <h1 class="auth-heading">Welcome Back</h1>
            <p class="auth-description">Log in to continue using Tech.S AI.</p>
            {% if error %}
            <div class="alert-message alert-error">{{ error }}</div>
            {% endif %}
            {% if success %}
            <div class="alert-message alert-success">✓ {{ success }}</div>
            {% endif %}
            <form method="POST" action="/login/">
                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input id="email" name="email" type="email" class="form-input" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="password-wrapper">
                        <input id="password" name="password" type="password" class="form-input" placeholder="Enter your password" required>
                        <button type="button" class="password-toggle" id="password-toggle" title="Show/Hide Password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Log In</button>
            </form>
            <p class="auth-link">Don't have an account? <a href="/signup/">Create one</a></p>
        </div>
    </section>

    <script defer src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker registered!'))
                    .catch(err => console.log('Service Worker failed: ', err));
            });
        }
    </script>
</body>
</html>
